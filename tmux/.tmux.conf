# ==========================
# General Settings
# ==========================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set-hook -g after-split-window "run-shell 'sleep 3'"

# Change prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ==========================
# Keybinds
# ==========================
# Splits (in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Vim-style pane navigation (works with vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Resize panes with prefix + arrow keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode (vim keys) — cross-platform clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ==========================
# Monokai Classic Theme (black bg, matching OpenCode)
# ==========================
# Status bar
set -g status-position bottom
set -g status-style "bg=#000000,fg=#f8f8f2"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#a6e22e,fg=#000000,bold] #S #[bg=#000000] "
set -g status-right "#[fg=#505050]%H:%M #[fg=#f8f8f2]%d-%b-%y #[bg=#66d9ef,fg=#000000,bold] #h "

# Window status (rainbow by index: 1=pink 2=orange 3=yellow 4=green 5=cyan 6=purple)
setw -g window-status-format "#{?#{==:#I,1},#[bg=#f92672]#[fg=#000000],#{?#{==:#I,2},#[bg=#fd971f]#[fg=#000000],#{?#{==:#I,3},#[bg=#e6db74]#[fg=#000000],#{?#{==:#I,4},#[bg=#a6e22e]#[fg=#000000],#{?#{==:#I,5},#[bg=#66d9ef]#[fg=#000000],#{?#{==:#I,6},#[bg=#ae81ff]#[fg=#000000],#[bg=#75715e]#[fg=#f8f8f2]}}}}}} #I:#W #[default]"
setw -g window-status-current-format "#{?#{==:#I,1},#[bg=#f92672]#[fg=#000000]#[bold],#{?#{==:#I,2},#[bg=#fd971f]#[fg=#000000]#[bold],#{?#{==:#I,3},#[bg=#e6db74]#[fg=#000000]#[bold],#{?#{==:#I,4},#[bg=#a6e22e]#[fg=#000000]#[bold],#{?#{==:#I,5},#[bg=#66d9ef]#[fg=#000000]#[bold],#{?#{==:#I,6},#[bg=#ae81ff]#[fg=#000000]#[bold],#[bg=#75715e]#[fg=#f8f8f2]#[bold]}}}}}} #I:#W #[default]"
setw -g window-status-activity-style "bg=#004d00,fg=#f8f8f2,bold"
setw -g window-status-bell-style "bg=#004d00,fg=#f8f8f2,bold"

# Pane borders
set -g pane-border-style "fg=#2d2d2d"
set -g pane-active-border-style "fg=#66d9ef"

# Message style
set -g message-style "bg=#1a1a1a,fg=#f8f8f2"

# ==========================
# Notifications (silence/activity)
# ==========================
# Use per-window: setw monitor-silence 15
set -g silence-action other
set -g visual-silence off
set -g visual-bell off
set-hook -g alert-silence 'run-shell "osascript -e \"display notification \\\"Window #I is ready for input\\\" with title \\\"OpenCode\\\" sound name \\\"Glass\\\"\""'

# ==========================
# Plugins (via tpm)
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Initialize tpm (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
